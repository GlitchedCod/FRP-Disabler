apply plugin: 'com.android.application'

def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file("keystore.properties")
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

def storeFilePath = keystoreProperties['STORE_FILE'] ?: System.getenv('STORE_FILE')
def storePassword = keystoreProperties['STORE_PASSWORD'] ?: System.getenv('STORE_PASSWORD')
def keyAlias = keystoreProperties['KEY_ALIAS'] ?: System.getenv('KEY_ALIAS')
def keyPassword = keystoreProperties['KEY_PASSWORD'] ?: System.getenv('KEY_PASSWORD')

android {
    namespace "frp.bypass"
    compileSdkVersion 36
    defaultConfig {
        applicationId "frp.bypass"
        minSdkVersion 22
        targetSdkVersion 36
        versionCode 1
        versionName "1.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }
    signingConfigs {
        release {
            if (storeFilePath) {
                storeFile file(storeFilePath)
            }
            storePassword storePassword
            keyAlias keyAlias
            keyPassword keyPassword
        }
    }
    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
}
