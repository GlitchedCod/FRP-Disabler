name: Android CI

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew
    - name: Get app version name
      id: version
      run: |
        VERSION_NAME=$(grep -Po 'versionName\s*"\K[^"]+' app/build.gradle)
        echo "VERSION_NAME=$VERSION_NAME" >> $GITHUB_OUTPUT
    - name: Build Release APK
      run: ./gradlew assembleRelease --no-daemon
    - name: Rename release APK
      run: |
        VERSION_NAME=${{ steps.version.outputs.VERSION_NAME }}
        mv app/build/outputs/apk/release/app-release.apk "FRP-Bypass-version-${VERSION_NAME}.apk"
    - name: Upload APK artifact
      uses: actions/upload-artifact@v4
      with:
        name: FRP-Bypass-version-${{ steps.version.outputs.VERSION_NAME }}
        path: FRP-Bypass-version-${{ steps.version.outputs.VERSION_NAME }}.apk
