name: Android CI

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew
    - name: Decode keystore from secret
      run: |
        printf '%s' "${{ secrets.BASE64_KEYSTORE }}" | base64 --decode > "${{ github.workspace }}/glitchedcod.keystore"
    - name: Get app version name
      id: version
      run: |
        VERSION_NAME=$(grep -Po 'versionName\s*"\K[^"]+' app/build.gradle)
        echo "VERSION_NAME=$VERSION_NAME" >> $GITHUB_OUTPUT
    - name: Build Release APK
      env:
        STORE_FILE: ${{ secrets.STORE_FILE }}
        STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
        KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      run: ./gradlew assembleRelease --no-daemon
    - name: Rename release APK
      run: |
        VERSION_NAME=${{ steps.version.outputs.VERSION_NAME }}
        APK_PATH=$(find app/build/outputs/apk/release -maxdepth 1 -name '*.apk' | head -n 1)
        if [ -z "$APK_PATH" ]; then
          echo "Release APK not found in app/build/outputs/apk/release" >&2
          ls -la app/build/outputs/apk/release
          exit 1
        fi
        mv "$APK_PATH" "FRP-Bypass-version-${VERSION_NAME}.apk"
    - name: Upload APK artifact
      uses: actions/upload-artifact@v4
      with:
        name: FRP-Bypass-version-${{ steps.version.outputs.VERSION_NAME }}
        path: FRP-Bypass-version-${{ steps.version.outputs.VERSION_NAME }}.apk
